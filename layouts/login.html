<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <title>Iniciar sesión | FLUXO SHOP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Sistema de punto de venta (POS) y control de inventario Fluxo Shop." name="description" />

    <!-- App favicon -->
    <link rel="shortcut icon" href="/assets/images/favicon.ico">

    <!-- Theme Config Js -->
    <script src="/assets/js/config.js"></script>

    <!-- App css -->
    <link href="/assets/css/app.min.css" rel="stylesheet" type="text/css" id="app-style" />

    <!-- Icons css -->
    <link href="/assets/css/icons.min.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="/assets/css/custom.css" rel="stylesheet" type="text/css" />
</head>

<body class="authentication-bg position-relative">
    <div class="account-pages pt-2 pt-sm-5 pb-4 pb-sm-5 position-relative">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-xxl-8 col-lg-10">
                    <div class="card overflow-hidden border-0 shadow-lg" style="border-radius: 18px !important;">
                        <div class="row g-0">
                            <div class="col-lg-6 d-none d-lg-block p-2">
                                <img src="/assets/images/auth-img.jpg" alt="Fluxo Shop" class="img-fluid rounded-4 h-100" style="object-fit: cover;">
                            </div>
                            <div class="col-lg-6">
                                <div class="d-flex flex-column h-100">
                                    <div class="auth-brand p-4 pb-2">
                                        <a href="/login" class="logo-light" style="text-decoration: none;">
                                            <span class="text-white fs-22 fw-bold notranslate" translate="no" style="font-family: 'Outfit', sans-serif; letter-spacing: 0.5px;">FLUXO SHOP</span>
                                        </a>
                                        <a href="/login" class="logo-dark d-flex align-items-center" style="text-decoration: none;">
                                            <span class="text-primary fs-22 fw-extrabold notranslate" translate="no" style="font-family: 'Outfit', sans-serif; letter-spacing: 0.5px;">FLUXO SHOP</span>
                                        </a>
                                    </div>
                                    <div class="p-4 my-auto">
                                        <span class="badge bg-info-subtle text-info mb-2 px-2 py-1">Sistema POS & Inventario</span>
                                        <h4 class="fs-22 fw-bold mb-1">¡Bienvenido de nuevo!</h4>
                                        <p class="text-muted mb-4 fs-13">Ingresa tus credenciales para acceder al panel de control.</p>
                                        <div id="login-alert" class="mb-3"></div>

                                        <form id="login-form">
                                            <div class="mb-3">
                                                <label for="emailaddress" class="form-label fw-semibold">Correo electrónico</label>
                                                <div class="input-group">
                                                    <span class="input-group-text bg-light border-end-0"><i class="ri-mail-line text-muted"></i></span>
                                                    <input class="form-control border-start-0 ps-0" type="email" id="emailaddress" required autofocus placeholder="usuario@empresa.com">
                                                </div>
                                            </div>
                                            <div class="mb-4">
                                                <label for="password" class="form-label fw-semibold">Contraseña</label>
                                                <div class="input-group">
                                                    <span class="input-group-text bg-light border-end-0"><i class="ri-lock-2-line text-muted"></i></span>
                                                    <input class="form-control border-start-0 border-end-0 ps-0" type="password" required id="password" placeholder="••••••••">
                                                    <button class="btn btn-light border border-start-0" type="button" id="toggle-login-password" tabindex="-1" title="Mostrar / ocultar contraseña">
                                                        <i class="ri-eye-line text-muted" id="icon-login-password"></i>
                                                    </button>
                                                </div>
                                            </div>
                                            <div class="mb-0 text-start">
                                                <button class="btn btn-primary w-100 py-2 fw-bold shadow-sm" type="submit" id="btn-login" style="border-radius: 10px;">
                                                    <i class="ri-login-circle-line me-1 align-middle fs-16"></i>
                                                    <span>Ingresar al Sistema</span>
                                                </button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer footer-alt fw-medium">
        <span class="text-dark">
            <script>document.write(new Date().getFullYear())</script> © Fluxo Shop - Diseñado por JRDA
        </span>
    </footer>

    <!-- Vendor js -->
    <script src="/assets/js/vendor.min.js"></script>

    <!-- App js -->
    <script src="/assets/js/app.min.js"></script>

    <script>
        const toggleBtn = document.getElementById("toggle-login-password");
        if (toggleBtn) {
            toggleBtn.addEventListener("click", function () {
                const pwdInput = document.getElementById("password");
                const icon = document.getElementById("icon-login-password");
                if (pwdInput.type === "password") {
                    pwdInput.type = "text";
                    icon.className = "ri-eye-off-line text-primary";
                } else {
                    pwdInput.type = "password";
                    icon.className = "ri-eye-line text-muted";
                }
            });
        }

        function mostrarAlerta(mensaje, tipo) {
            const alertDiv = document.getElementById("login-alert");
            if (alertDiv) {
                alertDiv.innerHTML = `
                    <div class="alert alert-${tipo} alert-dismissible fade show" role="alert">
                        <i class="ri-error-warning-line me-1"></i> ${mensaje}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                `;
            } else {
                alert(mensaje);
            }
        }

        document.getElementById("login-form").addEventListener("submit", async function (e) {
            e.preventDefault();

            const email = document.getElementById("emailaddress").value.trim();
            const password = document.getElementById("password").value;

            if (!email || !password) return;

            const btn = document.getElementById("btn-login");
            btn.disabled = true;

            try {
                const res = await fetch("/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                let data = {};
                try {
                    data = await res.json();
                } catch (errJson) {
                    console.error("Response is not JSON", errJson);
                }

                if (res.ok) {
                    window.location.href = "/";
                } else {
                    mostrarAlerta(data.detail || "Credenciales incorrectas.", "danger");
                    btn.disabled = false;
                }
            } catch (err) {
                mostrarAlerta("Error de conexión.", "danger");
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
